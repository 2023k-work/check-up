<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CheckUp Format v2 browser editor and live preview"
    />
    <title>CheckUp</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>CheckUp</h1>
        <p>.cup Format v2 editor</p>
        <nav class="mode-tabs" aria-label="編輯模式">
          <button type="button" data-mode="design">設計</button>
          <button type="button" data-mode="fill">填寫</button>
          <button type="button" data-mode="source">原始碼</button>
        </nav>
      </header>

      <main class="editor-shell">
        <div class="workspace-status">
          <span id="mode-description"></span>
          <output id="status" aria-live="polite">準備中</output>
        </div>
        <div id="diagnostics" class="diagnostics" aria-live="polite" hidden></div>

        <section id="design-view" class="mode-view" aria-label="設計模式"></section>
        <section id="fill-view" class="mode-view" aria-label="填寫模式"></section>
        <section id="source-view" class="mode-view source-view" aria-label="原始碼模式">
          <textarea
            id="source-editor"
            aria-label="CheckUp .cup 原始碼"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          ></textarea>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
